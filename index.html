<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UW Student Portal (Training App)</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
</head>
<body>

<header>
    <h1>UW Student Portal</h1>
    <p class="note">
        Training app. Fake data only. Do not enter real passwords.
    </p>
</header>

<main>

    <section id="loginBox">
        <h2>Sign in</h2>

        <form id="loginForm">
            <label for="email">Email</label>
            <input id="email" type="text" autocomplete="off">

            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="off">

            <button type="submit">Sign in</button>
        </form>

        <p id="loginMsg" role="alert"></p>

        <p class="note">
            Demo accounts: ayesha@uw.test / ayesha123 (student)
        </p>
    </section>

    <section id="dash" class="hidden">

        <h2 id="welcome"></h2>

        <button id="logout">Sign out</button>

        <h3>My Results</h3>

        <form id="resultForm">
            <label for="rid">Student ID</label>
            <input id="rid" type="text">
            <button type="submit">View Result</button>
        </form>

        <p id="resultOut"></p>

        <h3>Search Courses</h3>

        <form id="searchForm">
            <input id="q" type="text" placeholder="Search courses">
            <button type="submit">Search</button>
        </form>

        <p id="searchOut"></p>

        <section id="admin" class="hidden">
            <h3>Admin Panel</h3>
            <ul id="userList"></ul>
        </section>

        <p>
            <a href="https://example.com/fee-policy" target="_blank">
                Fee Policy (External)
            </a>
        </p>

    </section>

</main>

<script src="app.js"></script>

</body>
</html>
